# Lore Vault 設定範例（複製成 config.toml 後修改；以 --config 或環境變數 LORE_VAULT_CONFIG 指定）。
# 優先序：環境變數 LORE_VAULT_<區段>_<項目>（例：LORE_VAULT_EMBEDDING_BASE_URL）> 本檔 > 預設值。
# 密鑰不可寫在這裡：OpenAI key 只從環境變數 OPENAI_API_KEY（或 .env）讀取，
# 本檔出現 api_key／token／secret／password 之類的鍵會直接拒絕載入。
# HTTP API 的 bearer token 只從環境變數 LORE_VAULT_API_TOKEN 讀取（未設定時服務拒絕啟動）。

[database]
# 資料庫路徑（資料目錄尚未定案，見 D5；無預設值）
# path = "C:/path/to/lore.db"

[embedding]
provider = "ollama"
# docker 內請改 http://host.docker.internal:11434
base_url = "http://localhost:11434"
model = "bge-m3"
dim = 1024
timeout = 30.0
# HTTP API 請求路徑（recall、write 查重）的逾時（秒）；逾時即降級為只走 lexical
query_timeout = 3.0
# 每分鐘呼叫上限；0 = 不限
rate_per_minute = 0
# Ollama keep_alive：請求後模型留在記憶體多久（Go duration；純整數為秒數、負值＝常駐；
# 空字串＝不送，用 Ollama 預設 5m）。冷啟動載入約 2 秒，逼近 query_timeout
keep_alive = "30m"

[summary]
provider = "openai"
base_url = "https://api.openai.com/v1"
model = "gpt-6-luna"
# 必須明確設定：不指定時推理會吃光 max_completion_tokens、回傳空字串（D4）
reasoning_effort = "low"
max_completion_tokens = 1000
timeout = 60.0
rate_per_minute = 30

[worker]
# 同一版本最多嘗試幾次，超過標記失敗（doctor enrich.failed 會紅）
max_attempts = 3
# 每輪每種補算最多處理幾則
batch_size = 50
# 失敗後重試間隔（秒）：第 n 次失敗後等 retry_backoff * 2^(n-1)
retry_backoff = 60.0
# 常駐模式兩輪之間的間隔（秒）
poll_interval = 30.0

[backup]
# 備份目錄（容器內為 /backups，由主機 bind mount 一個只放備份的目錄）
# dir = "/backups"
# 保留最近幾份
keep = 7
# doctor「最近一次備份」門檻（小時）：超過或從未備份為 fail
max_age_hours = 26.0

[api]
# HTTP 服務是否在同一程序內跑背景補算 worker（單一寫入程序，A9）；關閉時另跑 python -m lore_vault.enrich
enrich_worker = true
# 啟動後在背景做一次 embedding 暖機（用完整 embedding.timeout；不阻擋啟動、失敗只記 log，
# 結果見 /v1/status 的 embedding.warmup）
embedding_warmup = true

[mcp]
# 各機器本地 MCP 殼（python -m lore_vault.mcp）。token 與 CF 憑證是密鑰，不寫在這裡：
# LORE_VAULT_API_TOKEN、CF_ACCESS_CLIENT_ID／CF_ACCESS_CLIENT_SECRET 走環境變數或 --env-file。
# 服務位址：本機 docker 為 127.0.0.1:5056；遠端改成 Cloudflare 子網域（https://...）
base_url = "http://127.0.0.1:5056"
# 每個請求的逾時（秒）；逾時視為服務不可達（讀取降級、寫入失敗）
timeout = 10.0
# 本地唯讀快照目錄（無預設；未設定時服務不可達就無法降級讀取）
# snapshot_dir = "C:/path/to/lore-vault/snapshot"
# 定期拉快照的間隔（秒）；0 = 只在殼啟動時拉一次
snapshot_interval = 900.0
# doctor 快照年齡門檻（小時）
snapshot_max_age_hours = 24.0
# Cloudflare Access service token 檔（格式同 ~/.cloudflared/pm-token.env）；本機直連不需要
# cf_access_env_file = "~/.cloudflared/pm-token.env"
